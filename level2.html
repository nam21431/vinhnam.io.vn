<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Puzzle - Level 2</title>
    <style>body{background:#0d1117;color:#c9d1d9;font-family:monospace;text-align:center;padding-top:80px;}</style>
</head>
<body>
    <h1>LEVEL 2</h1>
    <p>Giải mã dãy nhị phân sau thành một từ tiếng Anh (viết thường):</p>
    <p style="font-size: 20px; color: #58a6ff;"><b>01100011 01101111 01100100 01100101</b></p>
    <input type="text" id="ans" placeholder="Nhập từ...">
    <button onclick="check()">Gửi</button>
    <script>
        function check() {
            if(document.getElementById('ans').value.trim().toLowerCase() === "code") {
                alert("Chuẩn xác!");
                window.location.href = "level3.html";
            } else { alert("Sai rồi!"); }
        }
    </script>
</body>
</html>
