<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HARDEST QUESTION</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: monospace;
            text-align: center;
            padding-top: 100px;
        }
        .container {
            border: 1px dashed #00ff66;
            padding: 40px;
            display: inline-block;
            background: #0a0a0a;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            max-width: 500px;
        }
        input {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-family: monospace;
            outline: none;
            width: 280px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            margin-top: 15px;
        }
        button:hover {
            background: #00cc52;
        }
        .hint {
            color: #444;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LEVEL 1</h1>
        <p>To reach next level, you must type the correct answer use 3 hint.</p>
        <hr style="border-color: #003311; margin: 20px 0;">
        
        <p style="color: #888; font-size: 13px;">
            🧩 10565740<br>
            🧩 Geometry Dash
        </p>
        
        <br>
        <input type="text" id="secretPassBox" name="random_key_9988" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type correct answer.">
        <br>
        <button>SUBMIT</button>

        <div class="hint">Tip: This is an OG level.</div>
    </div>

    <script>
        (function() {
            let triggered = false;

            function triggerCheatDetected() {
                if (triggered) return;
                triggered = true;
                // Instantly reload/restart the page
                window.location.reload();
            }

            // 1. Instant Dimension Check (Triggers instantly when DevTools panel opens)
            const threshold = 140;
            function checkDevTools() {
                if (window.outerWidth - window.innerWidth > threshold || window.outerHeight - window.innerHeight > threshold) {
                    triggerCheatDetected();
                }
            }
            window.addEventListener('resize', checkDevTools);
            setInterval(checkDevTools, 50); // Checks every 50ms

            // 2. Immediate Debugger Trap
            setInterval(function () {
                const startTime = performance.now();
                debugger;
                const endTime = performance.now();
                if (endTime - startTime > 50) {
                    triggerCheatDetected();
                }
            }, 100);

            // 3. Block shortcuts
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                    (e.ctrlKey && e.key.toUpperCase() === 'U')
                ) {
                    e.preventDefault();
                    triggerCheatDetected();
                }
            });

            // Verification logic (IIFE)
            async function verify() {
                const passInput = document.getElementById('secretPassBox');
                if (!passInput) return;
                let val = passInput.value.trim().toLowerCase();
                
                const msgBuffer = new TextEncoder().encode(val);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const userHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const correctHash = "e42aa6d4fad4f1d68db8aa0a108230a7a95d3620b79996201b50b0ec8a7b8d28";
                
                if (userHash === correctHash) {
                    alert("ACCESS GRANTED. Redirecting...");
                    window.location.href = "thislevelishard";
                } else {
                    alert("ACCESS DENIED. Wrong answer son.");
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                const inputEl = document.getElementById('secretPassBox');
                const btnEl = document.querySelector('button');

                if (inputEl) {
                    inputEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') verify();
                    });
                }
                if (btnEl) {
                    btnEl.addEventListener('click', verify);
                }
            });
        })();
    </script>
</body>
</html>
