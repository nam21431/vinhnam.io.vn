<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Puzzle - Level 3</title>
    <style>body{background:#0d1117;color:#c9d1d9;font-family:monospace;text-align:center;padding-top:80px;}</style>
</head>
<body>
    <h1>LEVEL 3</h1>
    <p>Không có gợi ý nào ở đây cả. Hoặc là có?... (Thử nhấn F12 xem sao)</p>

    <!-- Gợi ý ẩn trong mã nguồn: Mật khẩu là "secret_key" -->
    <!-- Manh mối: password = secret_key -->

    <input type="text" id="ans" placeholder="Nhập mật khẩu...">
    <button onclick="check()">Gửi</button>
    <script>
        function check() {
            if(document.getElementById('ans').value.trim() === "secret_key") {
                alert("Hay lắm!");
                window.location.href = "level4.html";
            } else { alert("Sai rồi!"); }
        }
    </script>
</body>
</html>
