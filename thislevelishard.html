<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HARDEST QUESTION</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;

        .container {
            border: 1px dashed #00ff66;

        }
        input {
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-family: monospace;
            outline: none;
            width: 280px;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
            margin-top: 15px;
        }
        button:hover {
            background: #00cc52;
        }
        .hint {
            color: #444;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>LEVEL 2</h1>
        <p>To reach next level, you must type the correct answer use 3 hint.</p>
        <hr style="border-color: #003311; margin: 20px 0;">
        
        <p style="color: #888; font-size: 13px;">
            🧩 Top 1.<br>
            🧩 Time machine, pointercrate.<br>
            🧩 January 18th 2024 at 12:00:00am GMT+07:00
        </p>
        
        <br>
        <input type="text" id="secretPassBox" name="random_key_9988" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type correct answer.">
        <br>
        <button>SUBMIT</button>

        <div class="hint">Tip: No more lol.</div>
    </div>

            <script>
        // IIFE Private Scope Encapsulation
        (function() {
            // Anti-Console / Anti-DevTools Trap
            setInterval(function () {
                const startTime = performance.now();
                debugger; // Breaks execution if DevTools is open
                const endTime = performance.now();
                if (endTime - startTime > 100) {
                    document.body.innerHTML = "<h1 style='color:red;'>CHEAT DETECTED! CLOSE CONSOLE TO PLAY.</h1>";
                }
            }, 500);

            // Anti-cheat shortcuts
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) ||
                    (e.ctrlKey && e.key.toUpperCase() === 'U')
                ) {
                    e.preventDefault();
                }
            });

            // Private Verification Function (NOT attached to window)
            async function verify() {
                const passInput = document.getElementById('secretPassBox');
                if (!passInput) return;
                let val = passInput.value.trim().toLowerCase();
                
                const msgBuffer = new TextEncoder().encode(val);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const userHash = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

                const correctHash = "640bbae29e5802c1e2c42c745377d5c0857d3c68d3dd47481469d2feec8b8898";
                
                if (userHash === correctHash) {
                    alert("ACCESS GRANTED. Redirecting...");
                    window.location.href = "how";
                } else {
                    alert("ACCESS DENIED. Wrong answer son.");
                }
            }

            // Event Listeners attached internally
            document.addEventListener('DOMContentLoaded', () => {
                const inputEl = document.getElementById('secretPassBox');
                const btnEl = document.querySelector('button');

                if (inputEl) {
                    inputEl.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') verify();
                    });
                }
                if (btnEl) {
                    btnEl.addEventListener('click', verify);
                }
            });
        })();
    </script>

</body>
</html>
