<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng - Puzzle</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            text-align: center;
            padding-top: 50px;
        }
        .container {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 30px;
            display: inline-block;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #30363d;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #21262d;
            color: #58a6ff;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #58a6ff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏆 BẢNG XẾP HẠNG</h1>
        <p>Danh sách người chơi phá đảo câu đố</p>

        <!-- Bảng hiển thị -->
        <table>
            <thead>
                <tr>
                    <th>Hạng</th>
                    <th>Tên</th>
                    <th>Điểm</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <!-- Dữ liệu tự động điền từ đoạn code JavaScript bên dưới -->
            </tbody>
        </table>

        <a href="index.html" class="back-link">← Quay lại màn 1</a>
    </div>

    <script>
        // ==========================================================
        // BẠN HÃY SỬA TRỰC TIẾP DANH SÁCH DƯỚI ĐÂY TRÊN GIAO DIỆN GITHUB
        // ==========================================================
        const leaderboardData = [
            { name: "mrroller", score: 100 },
            { name: "PlayerX", score: 0 },
            // Muốn thêm người khác, bạn copy dòng dưới dán vào đây:
            // { name: "Tên_Người_Chơi", score: Số_Điểm },
        ];

        function renderLeaderboard() {
            let tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = "";

            // Sắp xếp tự động từ điểm cao xuống thấp
            leaderboardData.sort((a, b) => b.score - a.score);

            leaderboardData.forEach((item, index) => {
                let row = `<tr>
                    <td>#${index + 1}</td>
                    <td>${item.name}</td>
                    <td>${item.score}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Chạy hàm hiển thị khi mở trang
        renderLeaderboard();
    </script>

</body>
</html>
